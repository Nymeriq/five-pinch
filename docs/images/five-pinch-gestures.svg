<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Five Pinch: your apps, a gesture away</title>
<desc id="desc">Gesture illustration, not a screenshot. Five contacts move inward to open the application grid, and outward to close it.</desc>
