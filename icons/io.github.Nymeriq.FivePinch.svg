<title id="title">Five Pinch</title><desc id="desc">Five fingertips moving inward on a teal rounded square.</desc>
<defs>
<linearGradient id="base" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse"><stop stop-color="#19c8b0"/><stop offset="1" stop-color="#087c8c"/></linearGradient>
<linearGradient id="shine" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect x="8" y="12" width="112" height="110" rx="28" fill="#075866"/>
<rect x="8" y="6" width="112" height="110" rx="28" fill="url(#base)"/>
<rect x="9" y="7" width="110" height="108" rx="27" fill="none" stroke="url(#shine)" stroke-width="2"/>
<g fill="#f3fffc" stroke="#f3fffc" stroke-linecap="round" stroke-linejoin="round">
<g id="finger"><circle cx="64" cy="28" r="7" stroke="none"/><path d="M64 41v10m-4-4 4 4 4-4" fill="none" stroke-width="3.5"/></g>
<use href="#finger" transform="rotate(72 64 62)"/>
<use href="#finger" transform="rotate(144 64 62)"/>
<use href="#finger" transform="rotate(216 64 62)"/>
<use href="#finger" transform="rotate(288 64 62)"/>
</g>
<circle cx="64" cy="62" r="4" fill="#b9fff0"/>
</svg>
